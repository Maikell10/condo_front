<app-auth-shell
  title="Bienvenido"
  subtitle="Selecciona tu perfil para ingresar"
  icon="waving_hand"
  accent="picker"
  backLink="/"
  backLabel="Volver al inicio"
  [showIconBadge]="false">

  <div class="auth-profiles">
    @for (profile of profiles; track profile.path) {
      <button
        type="button"
        class="auth-profile-btn"
        [attr.data-accent]="profile.accent"
        (click)="goTo(profile.path)">
        <div class="auth-profile-icon">
          <mat-icon>{{ profile.icon }}</mat-icon>
        </div>
        <div class="auth-profile-copy">
          <h3>{{ profile.title }}</h3>
          <p>{{ profile.subtitle }}</p>
        </div>
        <div class="auth-profile-arrow">
          <mat-icon>chevron_right</mat-icon>
        </div>
      </button>
    }
  </div>
</app-auth-shell>
