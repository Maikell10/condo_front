<app-auth-shell
  title="Super Administrador"
  subtitle="Control total del sistema"
  icon="admin_panel_settings"
  accent="admin">

  <form class="auth-form" (ngSubmit)="onSubmit()">
    <mat-form-field appearance="outline">
      <mat-label>Correo electrónico</mat-label>
      <mat-icon matPrefix class="auth-field-icon">mail_outline</mat-icon>
      <input
        matInput
        [(ngModel)]="email"
        name="email"
        type="email"
        placeholder="admin@condomanager.com"
        required
        autocomplete="email"
        [disabled]="isLoading" />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Contraseña</mat-label>
      <mat-icon matPrefix class="auth-field-icon">lock_outline</mat-icon>
      <input
        matInput
        [(ngModel)]="password"
        name="password"
        [type]="showPassword ? 'text' : 'password'"
        required
        autocomplete="current-password"
        [disabled]="isLoading" />
      <button
        mat-icon-button
        matSuffix
        type="button"
        (click)="showPassword = !showPassword"
        [attr.aria-label]="showPassword ? 'Ocultar contraseña' : 'Mostrar contraseña'">
        <mat-icon>{{ showPassword ? 'visibility_off' : 'visibility' }}</mat-icon>
      </button>
    </mat-form-field>

    <button
      mat-flat-button
      color="primary"
      type="submit"
      class="auth-submit"
      [disabled]="isLoading">
      <mat-spinner *ngIf="isLoading" diameter="20" class="auth-spinner"></mat-spinner>
      {{ isLoading ? 'Validando...' : 'Entrar al sistema' }}
    </button>

    <p *ngIf="error" class="auth-error">
      <mat-icon>error_outline</mat-icon>
      {{ error }}
    </p>
  </form>
</app-auth-shell>
