<app-auth-shell
  title="Acceso Propietario"
  subtitle="Ingresa el código único de tu apartamento"
  icon="vpn_key"
  accent="owner">

  <form class="auth-form" (ngSubmit)="onSubmit()">
    <mat-form-field appearance="outline">
      <mat-label>Código de acceso (8 caracteres)</mat-label>
      <mat-icon matPrefix class="auth-field-icon">vpn_key</mat-icon>
      <input
        matInput
        type="text"
        class="auth-code-input"
        [(ngModel)]="accessCode"
        name="accessCode"
        placeholder="A8K3M9P2"
        maxlength="8"
        minlength="8"
        required
        autocomplete="off"
        [disabled]="isLoading" />
      <mat-hint>Ejemplo: A8K3M9P2</mat-hint>
    </mat-form-field>

    <button
      mat-flat-button
      color="primary"
      type="submit"
      class="auth-submit"
      [disabled]="isLoading || !accessCode || accessCode.length !== 8">
      <mat-spinner *ngIf="isLoading" diameter="20" class="auth-spinner"></mat-spinner>
      {{ isLoading ? 'Verificando...' : 'Entrar al panel' }}
    </button>

    <p *ngIf="error" class="auth-error">
      <mat-icon>error_outline</mat-icon>
      {{ error }}
    </p>
  </form>
</app-auth-shell>
