<div class="confirm-dialog" [class.confirm-dialog--approve]="data.variant === 'approve'"
  [class.confirm-dialog--reject]="data.variant === 'reject'">

  <div class="confirm-dialog__icon-wrap">
    <mat-icon>{{ icon() }}</mat-icon>
  </div>

  <h2 mat-dialog-title class="confirm-dialog__title">{{ data.title }}</h2>

  <mat-dialog-content class="confirm-dialog__content">
    <p class="confirm-dialog__message">{{ data.message }}</p>
    @if (data.highlights?.length) {
      <ul class="confirm-dialog__highlights">
        @for (line of data.highlights; track line) {
          <li>{{ line }}</li>
        }
      </ul>
    }
  </mat-dialog-content>

  <mat-dialog-actions align="end" class="confirm-dialog__actions">
    <button mat-stroked-button type="button" class="confirm-dialog__cancel" (click)="cancel()">
      {{ data.cancelLabel || 'Cancelar' }}
    </button>
    <button mat-flat-button type="button" class="confirm-dialog__confirm" (click)="confirm()">
      {{ data.confirmLabel || 'Confirmar' }}
    </button>
  </mat-dialog-actions>
</div>
